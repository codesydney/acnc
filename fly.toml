# fly.toml app configuration file generated for acnc on 2025-10-27T06:30:00Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "acnc"
primary_region = "syd"

[build]

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

[[statics]]
  guest_path = "/app/static"
  url_prefix = "/static/"
