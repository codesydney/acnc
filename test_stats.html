<!DOCTYPE html>
<html>
<head>
    <title>Stats Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-8">
    <h1 class="text-2xl mb-4">Statistics Test</h1>
    <div id="stats" class="grid grid-cols-4 gap-4">
        <div class="bg-white rounded-lg shadow-md p-6 text-center">
            <div id="total" class="text-3xl font-bold text-blue-600 mb-2">Loading...</div>
            <div class="text-gray-600">Total Charities</div>
        </div>
    </div>

    <script>
        console.log('Test page loaded');
        
        fetch('http://localhost:8000/api/v1/charities/stats/overview')
            .then(response => {
                console.log('Response:', response);
                return response.json();
            })
            .then(data => {
                console.log('Data:', data);
                document.getElementById('total').textContent = data.total_charities.toLocaleString();
                alert('Stats loaded: ' + data.total_charities);
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error: ' + error);
            });
    </script>
</body>
</html>
